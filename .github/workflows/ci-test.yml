# Run on branch builds
name: CI-Go-Tests
permissions:
  contents: read
  id-token: write

on:
  push:
    branches-ignore:
      - master

jobs:
  go-build-test:
    name: go build test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Go Build
      run: |
        echo "machine github.com login machine-parsable password ${{ secrets.GH_PAT_MACHINE_PARSABLE }}" > ~/.netrc
        go build -v -o bin/casbin
    - name: Go Test
      run: go test -v -race ./...
